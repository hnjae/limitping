---
# GoReleaser config — produces prebuilt binaries so users don't need Go.
# Cut a release by pushing a tag:  git tag v0.1.0 && git push origin v0.1.0
# The release workflow (.github/workflows/release.yml) runs GoReleaser on tags.
version: 2
project_name: limitping
before:
  hooks:
    - go mod tidy
builds:
  - id: limitping
    main: ./cmd/limitping
    binary: limitping
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/hnjae/limitping/internal/cli.Version={{ .Version }}
archives:
  - id: limitping
    # No version in the name, so https://github.com/.../releases/latest/download/
    # URLs are stable (used by install.sh).
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE.md
      - LICENSES/AGPL-3.0-or-later.txt
checksum:
  name_template: "checksums.txt"
changelog:
  # The commit log IS the release notes — there is no hand-maintained changelog
  # to drift from it, so write commit subjects that read as release notes.
  # (The old conventional-commit excludes never matched anything here: this repo
  # writes plain imperative subjects, not `docs:` / `chore:` prefixes.)
  sort: asc
  filters:
    exclude:
      - "^Merge "
release:
  github:
    owner: hnjae
    name: limitping
